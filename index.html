<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craftchemy | Minecraft Anvil Solver & Progression Suite</title>
  <meta name="description" content="Optimal Minecraft anvil order calculator and early progression guide with genuine pixel textures.">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    :root {
      --bg-dark: #080b10;
      --panel-bg: #101722;
      --border-slot: #243042;
      --accent-cyan: #38bdf8;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --accent-purple: #c084fc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-pixel: "SF Mono", Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-pixel);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Iconos Pixel Art Nítidos */
    .mc-icon {
      width: 22px;
      height: 22px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      object-fit: contain;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .mc-icon-lg {
      width: 32px;
      height: 32px;
    }

    /* Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.75rem;
      border-bottom: 2px solid var(--border-slot);
      background: var(--panel-bg);
      flex-wrap: wrap;
      gap: 1rem;
    }
    .header-brand { display: flex; align-items: center; gap: 0.75rem; }
    .logo { font-size: 1.4rem; font-weight: 800; }
    .logo span { color: var(--accent-cyan); text-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
    .badge {
      background: #38bdf81a;
      color: var(--accent-cyan);
      border: 1px solid #38bdf850;
      padding: 0.2rem 0.5rem;
      font-size: 0.7rem;
      border-radius: 3px;
    }
    
    .header-controls { display: flex; align-items: center; gap: 1rem; }
    .nav-tabs { display: flex; gap: 0.5rem; }
    .tab-btn {
      background: #0b1017;
      border: 1px solid var(--border-slot);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.5rem 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { color: #fff; border-color: #3b82f6; }
    .tab-btn.active {
      background: #112838;
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
    }

    .lang-switch {
      display: flex;
      border: 1px solid var(--border-slot);
      border-radius: 4px;
      overflow: hidden;
    }
    .lang-btn {
      background: #0b1017;
      color: var(--text-muted);
      border: none;
      padding: 0.4rem 0.6rem;
      font-size: 0.75rem;
      font-family: inherit;
      cursor: pointer;
      font-weight: 700;
    }
    .lang-btn.active { background: var(--accent-cyan); color: #050b14; }

    .tab-content { display: none; flex: 1; }
    .tab-content.active { display: block; }

    /* Layout */
    .main-container {
      display: grid;
      grid-template-columns: 350px 1fr;
      min-height: calc(100vh - 110px);
    }
    .sidebar {
      background: var(--panel-bg);
      border-right: 2px solid var(--border-slot);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .sidebar h2 {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .item-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
    }
    .item-btn {
      background: #0b1017;
      border: 1px solid var(--border-slot);
      color: var(--text-main);
      padding: 0.5rem 0.6rem;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-radius: 3px;
      transition: all 0.15s;
    }
    .item-btn:hover { border-color: #3f516d; background: #131d2b; }
    .item-btn.active {
      border-color: var(--accent-cyan);
      background: #112838;
      color: #fff;
      box-shadow: inset 0 0 8px rgba(56, 189, 248, 0.25);
    }

    .enchant-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      max-height: 350px;
      overflow-y: auto;
    }
    .enchant-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.7rem;
      background: #0b1017;
      border: 1px solid var(--border-slot);
      cursor: pointer;
      font-size: 0.8rem;
      border-radius: 3px;
    }
    .enchant-item:hover { border-color: #3b82f6; }
    .enchant-item.selected {
      border-color: var(--accent-purple);
      background: #231535;
      color: #e9d5ff;
    }

    .btn-primary, .btn-secondary {
      font-family: inherit;
      font-weight: 700;
      padding: 0.7rem;
      cursor: pointer;
      border: none;
      font-size: 0.85rem;
      border-radius: 3px;
    }
    .btn-primary { background: var(--accent-cyan); color: #050b14; margin-top: auto; }
    .btn-secondary { background: #0f172a; border: 1px solid var(--border-slot); color: var(--text-muted); }

    /* Canvas */
    .canvas-area {
      position: relative;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 30%, #151d2a 0%, #070a0e 100%);
      padding: 1.25rem 1.75rem;
      overflow-y: auto;
    }
    .canvas-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .cost-pill {
      padding: 0.4rem 0.8rem;
      background: #0d1522;
      border: 1px solid var(--border-slot);
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 3px;
    }

    .tree-wrapper {
      position: relative;
      min-height: 420px;
      width: 100%;
      margin: 1rem 0;
    }
    .svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .nodes-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* Nodos con texturas oficiales */
    .tree-node {
      position: absolute;
      min-width: 170px;
      padding: 0.6rem 0.8rem;
      background: #0f1520;
      border: 2px solid var(--border-slot);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-align: left;
      border-radius: 3px;
    }
    .tree-node.target { border-color: var(--accent-green); }
    .tree-node.error { border-color: var(--accent-red); }
    .tree-node.enchanted { border-color: var(--accent-purple); background: #1c122b; }
    .tree-node-info h4 { font-size: 0.8rem; margin-bottom: 0.2rem; }
    .tree-node-info span { font-size: 0.7rem; color: var(--text-muted); }

    .status-banner {
      margin: 0.5rem 0;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      border-radius: 3px;
    }
    .status-banner.error { background: #ef444422; border: 1px solid var(--accent-red); color: var(--accent-red); }
    .status-banner.success { background: #22c55e22; border: 1px solid var(--accent-green); color: var(--accent-green); }
    .hidden { display: none !important; }

    .recipe-container {
      background: #0c121b;
      border: 1px solid var(--border-slot);
      padding: 1rem 1.25rem;
      margin-top: 1rem;
      border-radius: 4px;
    }
    .recipe-container h3 {
      font-size: 0.85rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
    }
    .recipe-steps { list-style-position: inside; display: flex; flex-direction: column; gap: 0.4rem; }
    .recipe-steps li {
      font-size: 0.8rem;
      color: #cbd5e1;
      padding: 0.4rem 0.6rem;
      background: #111827;
      border-left: 3px solid var(--accent-cyan);
    }
    .recipe-steps li strong { color: #fff; }
    .recipe-steps li span { color: var(--accent-purple); font-weight: 700; }

    /* Progresión */
    .progression-container {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: calc(100vh - 110px);
    }
    .progression-sidebar {
      background: var(--panel-bg);
      border-right: 2px solid var(--border-slot);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .milestone-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .milestone-btn {
      text-align: left;
      background: #0b1017;
      border: 1px solid var(--border-slot);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.15s;
    }
    .milestone-btn:hover { border-color: #38bdf888; }
    .milestone-btn.active {
      border-color: var(--accent-cyan);
      background: #112838;
      color: #fff;
      border-left: 4px solid var(--accent-cyan);
    }
    .survival-tip {
      margin-top: auto;
      padding: 0.85rem;
      background: #1c1917;
      border-left: 3px solid #eab308;
      font-size: 0.75rem;
      color: #fef08a;
      line-height: 1.4;
      border-radius: 3px;
    }
    .progression-content {
      padding: 2rem;
      background: radial-gradient(circle at 60% 20%, #151d2a 0%, #070a0e 100%);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-slot);
      padding-bottom: 1rem;
    }
    .stage-badge {
      background: #22c55e20;
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      border-radius: 3px;
    }
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
    }
    .prog-card {
      background: #0b1017;
      border: 1px solid var(--border-slot);
      padding: 1.2rem;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .prog-card .card-step {
      font-size: 0.7rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      font-weight: 700;
    }
    .prog-card h3 { font-size: 0.95rem; }
    .prog-card p { font-size: 0.8rem; color: #94a3b8; line-height: 1.4; }
    .recipe-calc-box {
      background: #101722;
      border: 1px solid var(--border-slot);
      padding: 1rem 1.25rem;
      border-radius: 4px;
    }
    .recipe-calc-box h3 { font-size: 0.85rem; color: var(--accent-cyan); margin-bottom: 0.4rem; }
    .recipe-calc-box p { font-size: 0.85rem; }

    .app-footer {
      text-align: center;
      padding: 0.6rem;
      font-size: 0.65rem;
      color: #475569;
      border-top: 1px solid var(--border-slot);
      background: var(--bg-dark);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-brand">
      <div class="logo">Craft<span>chemy</span></div>
      <span class="badge">Suite v1.5</span>
    </div>

    <div class="header-controls">
      <nav class="nav-tabs">
        <button class="tab-btn active" data-tab="anvilView" id="tabAnvil">
          <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/anvil.png" class="mc-icon" alt="Anvil">
          <span>Anvil Solver</span>
        </button>
        <button class="tab-btn" data-tab="progressionView" id="tabProgression">
          <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/oak_log.png" class="mc-icon" alt="Log">
          <span>Early Game</span>
        </button>
      </nav>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="es">ES</button>
      </div>
    </div>
  </header>

  <!-- VISTA 1: ANVIL SOLVER -->
  <main id="anvilView" class="tab-content active">
    <div class="main-container">
      <aside class="sidebar">
        <h2 id="lblSelectObject">1. Select Item</h2>
        <div class="item-grid">
          <button class="item-btn active" data-item="sword">
            <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/diamond_sword.png" class="mc-icon" alt="Sword">
            <span class="it-name">Sword</span>
          </button>
          <button class="item-btn" data-item="pickaxe">
            <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/diamond_pickaxe.png" class="mc-icon" alt="Pickaxe">
            <span class="it-name">Pickaxe</span>
          </button>
          <button class="item-btn" data-item="boots">
            <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/diamond_boots.png" class="mc-icon" alt="Boots">
            <span class="it-name">Boots</span>
          </button>
          <button class="item-btn" data-item="helmet">
            <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/diamond_helmet.png" class="mc-icon" alt="Helmet">
            <span class="it-name">Helmet</span>
          </button>
          <button class="item-btn" data-item="chestplate">
            <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/diamond_chestplate.png" class="mc-icon" alt="Chestplate">
            <span class="it-name">Chestplate</span>
          </button>
          <button class="item-btn" data-item="bow">
            <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/bow.png" class="mc-icon" alt="Bow">
            <span class="it-name">Bow</span>
          </button>
          <button class="item-btn" data-item="crossbow">
            <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/crossbow.png" class="mc-icon" alt="Crossbow">
            <span class="it-name">Crossbow</span>
          </button>
          <button class="item-btn" data-item="trident">
            <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/trident.png" class="mc-icon" alt="Trident">
            <span class="it-name">Trident</span>
          </button>
        </div>

        <h2 id="lblAddEnchants">2. Add Enchantments</h2>
        <div class="enchant-list" id="enchantList"></div>
        
        <button id="optimizeBtn" class="btn-primary">Calculate Optimal Path</button>
      </aside>

      <section class="canvas-area">
        <div class="canvas-header">
          <span id="costIndicator" class="cost-pill">Total Cost: -- levels</span>
          <button id="resetBtn" class="btn-secondary">Reset</button>
        </div>

        <div class="tree-wrapper" id="treeContainer">
          <svg id="svgOverlay" class="svg-layer"></svg>
          <div id="nodesLayer" class="nodes-layer"></div>
        </div>

        <div id="statusBanner" class="status-banner hidden"></div>

        <section class="recipe-container hidden" id="recipeBox">
          <h3 id="lblRecipeTitle">Anvil Instructions</h3>
          <ol id="recipeSteps" class="recipe-steps"></ol>
        </section>
      </section>
    </div>
  </main>

  <!-- VISTA 2: PROGRESIÓN -->
  <main id="progressionView" class="tab-content">
    <div class="progression-container">
      <aside class="progression-sidebar">
        <h2 style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;" id="lblMilestones">Milestones</h2>
        <div class="milestone-list">
          <button class="milestone-btn active" data-stage="wood" id="msWood">
            <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/oak_log.png" class="mc-icon" alt="Log">
            <span>1. First Log (Min 1)</span>
          </button>
          <button class="milestone-btn" data-stage="stone" id="msStone">
            <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/cobblestone.png" class="mc-icon" alt="Stone">
            <span>2. Stone Age (Min 3)</span>
          </button>
          <button class="milestone-btn" data-stage="night" id="msNight">
            <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/charcoal.png" class="mc-icon" alt="Charcoal">
            <span>3. Shelter & Charcoal</span>
          </button>
          <button class="milestone-btn" data-stage="iron" id="msIron">
            <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/iron_ingot.png" class="mc-icon" alt="Iron">
            <span>4. Iron & Shield</span>
          </button>
          <button class="milestone-btn" data-stage="diamond" id="msDiamond">
            <img src="https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.20.4/diamond.png" class="mc-icon" alt="Diamond">
            <span>5. Deepslate & Diamond</span>
          </button>
        </div>
        <div class="survival-tip" id="survivalTip"></div>
      </aside>

      <section class="progression-content">
        <div class="stage-header">
          <h2 id="stageTitle">Phase 1</h2>
          <span class="stage-badge" id="stageBadge">Min 0 - 2</span>
        </div>
        <div class="steps-grid" id="stageSteps"></div>
        <div class="recipe-calc-box">
          <h3 id="lblRawMaterials">Raw Material Calculator</h3>
          <p id="resourceBreakdown"></p>
        </div>
      </section>
    </div>
  </main>

  <footer class="app-footer">
    <p>NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.</p>
  </footer>

    let currentItem = "sword";

    function updateLanguageUI() {
      const t = UI_TRANSLATIONS[currentLang];
      
      document.querySelector("#tabAnvil span").textContent = t.tabAnvil;
      document.querySelector("#tabProgression span").textContent = t.tabProgression;
      document.getElementById("lblSelectObject").textContent = t.lblSelectObject;
      document.getElementById("lblAddEnchants").textContent = t.lblAddEnchants;
      document.getElementById("optimizeBtn").textContent = t.optimizeBtn;
      document.getElementById("resetBtn").textContent = t.resetBtn;
      document.getElementById("lblRecipeTitle").textContent = t.lblRecipeTitle;
      document.getElementById("lblMilestones").textContent = t.lblMilestones;
      document.getElementById("lblRawMaterials").textContent = t.lblRawMaterials;

      document.querySelectorAll(".lang-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.lang === currentLang);
      });

      document.querySelectorAll(".item-btn").forEach(b => {
        const itemKey = b.dataset.item;
        const nameSpan = b.querySelector(".it-name");
        if (nameSpan && t.items[itemKey]) {
          nameSpan.textContent = t.items[itemKey];
        }
      });

      renderEnchants();
      renderProgression(currentStage);
      if (document.getElementById("nodesLayer").children.length > 0) {
        optimizeTree();
      } else {
        document.getElementById("costIndicator").textContent = t.costDefault;
      }
    }

    function renderEnchants() {
      const list = document.getElementById("enchantList");
      list.innerHTML = "";
      const t = UI_TRANSLATIONS[currentLang];

      ENCHANTMENTS_DATA[currentItem].forEach(enc => {
        const isSel = selectedEnchants.some(e => e.id === enc.id);
        const displayName = currentLang === "es" ? enc.nameEs : enc.nameEn;
        const div = document.createElement("div");
        div.className = `enchant-item ${isSel ? "selected" : ""}`;
        div.innerHTML = `
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <img src="${ITEM_ICONS.book}" class="mc-icon" alt="Book">
            <span>${displayName}</span>
          </div>
          <span style="color:var(--text-muted);font-size:0.7rem;">${enc.level * enc.weight}${t.lvlShort}</span>
        `;
        div.onclick = () => {
          const idx = selectedEnchants.findIndex(e => e.id === enc.id);
          if (idx > -1) {
            selectedEnchants.splice(idx, 1);
          } else {
            if (enc.conflicts) selectedEnchants = selectedEnchants.filter(e => !enc.conflicts.includes(e.id));
            selectedEnchants.push(enc);
          }
          renderEnchants();
        };
        list.appendChild(div);
      });
    }

    function setupEvents() {
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.onclick = (e) => {
          currentLang = e.target.dataset.lang;
          updateLanguageUI();
        };
      });

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById(btn.dataset.tab).classList.add("active");
        };
      });

      document.querySelectorAll(".item-btn").forEach(btn => {
        btn.onclick = (e) => {
          document.querySelectorAll(".item-btn").forEach(b => b.classList.remove("active"));
          e.currentTarget.classList.add("active");
          currentItem = e.currentTarget.dataset.item;
          selectedEnchants = [];
          renderEnchants();
          clearTree();
        };
      });

      document.querySelectorAll(".milestone-btn").forEach(btn => {
        btn.onclick = (e) => {
          document.querySelectorAll(".milestone-btn").forEach(b => b.classList.remove("active"));
          e.currentTarget.classList.add("active");
          currentStage = e.currentTarget.dataset.stage;
          renderProgression(currentStage);
        };
      });

      document.getElementById("optimizeBtn").onclick = optimizeTree;
      document.getElementById("resetBtn").onclick = clearTree;
    }

    class AnvilNode {
      constructor(name, cost = 0, priorPenalty = 0, isTarget = false, isBook = true, icon = "", left = null, right = null) {
        this.name = name;
        this.cost = cost;
        this.priorPenalty = priorPenalty;
        this.isTarget = isTarget;
        this.isBook = isBook;
        this.icon = icon;
        this.left = left;
        this.right = right;
        this.x = 0;
        this.y = 0;
      }
    }

    function optimizeTree() {
      if (selectedEnchants.length === 0) return;
      clearTree();
      const t = UI_TRANSLATIONS[currentLang];

      const leaves = selectedEnchants.map(enc => {
        const dName = currentLang === "es" ? enc.nameEs : enc.nameEn;
        return new AnvilNode(dName, enc.level * enc.weight, 0, false, true, ITEM_ICONS.book);
      });
      leaves.sort((a, b) => b.cost - a.cost);

      const baseItemLabel = `${t.items[currentItem]} ${t.baseSuffix}`;
      const baseItem = new AnvilNode(baseItemLabel, 0, 0, false, false, ITEM_ICONS[currentItem]);

      let pool = [...leaves];
      let totalCost = 0;
      let isTooExpensive = false;
      const steps = [];

      while (pool.length > 1) {
        const a = pool.shift();
        const b = pool.shift();
        const penalty = (Math.pow(2, a.priorPenalty) - 1) + (Math.pow(2, b.priorPenalty) - 1);
        const cost = b.cost + penalty;
        totalCost += cost;
        if (cost > 39) isTooExpensive = true;

        steps.push({ left: a.name, right: b.name, cost: cost });
        pool.push(new AnvilNode(t.mergedBook, cost, Math.max(a.priorPenalty, b.priorPenalty) + 1, false, true, ITEM_ICONS.book, a, b));
      }

      const finalBook = pool[0];
      const finalPenalty = (Math.pow(2, baseItem.priorPenalty) - 1) + (Math.pow(2, finalBook.priorPenalty) - 1);
      const finalCost = finalBook.cost + finalPenalty;
      totalCost += finalCost;
      if (finalCost > 39) isTooExpensive = true;

      steps.push({ left: baseItem.name, right: finalBook.name, cost: finalCost });

      const rootName = `${t.items[currentItem]} ${t.perfectSuffix}`;
      const root = new AnvilNode(rootName, finalCost, Math.max(baseItem.priorPenalty, finalBook.priorPenalty) + 1, true, false, ITEM_ICONS[currentItem], baseItem, finalBook);

      renderTree(root);
      renderSteps(steps);

      const banner = document.getElementById("statusBanner");
      banner.classList.remove("hidden", "error", "success");
      if (isTooExpensive) {
        banner.classList.add("error");
        banner.textContent = t.errTooExpensive;
      } else {
        banner.classList.add("success");
        banner.textContent = t.succOptimal;
      }
      document.getElementById("costIndicator").textContent = `${t.costPrefix}${totalCost}${t.levels}`;
    }

    function renderTree(root) {
      const container = document.getElementById("nodesLayer");
      const svg = document.getElementById("svgOverlay");
      const t = UI_TRANSLATIONS[currentLang];
      let currentY = 40;

      function layout(node, depth) {
        if (!node.left && !node.right) {
          node.x = 120;
          node.y = currentY;
          currentY += 75;
          return;
        }
        if (node.left) layout(node.left, depth + 1);
        if (node.right) layout(node.right, depth + 1);
        node.x = 120 + (depth * 230);
        node.y = ((node.left ? node.left.y : currentY) + (node.right ? node.right.y : currentY)) / 2;
      }
      layout(root, 1);
      document.getElementById("treeContainer").style.minHeight = `${Math.max(currentY + 20, 420)}px`;

      function draw(node) {
        if (!node) return;
        const el = document.createElement("div");
        el.className = `tree-node ${node.isTarget ? "target" : ""} ${node.cost > 39 ? "error" : ""} ${node.isBook ? "enchanted" : ""}`;
        el.style.left = `${node.x}px`;
        el.style.top = `${node.y}px`;
        const costText = node.cost > 0 ? `${t.stepCost}: ${node.cost}${t.lvlShort}` : t.baseSuffix;
        
        el.innerHTML = `
          <img src="${node.icon}" class="mc-icon" alt="icon">
          <div class="tree-node-info">
            <h4>${node.name}</h4>
            <span>${costText}</span>
          </div>
        `;
        container.appendChild(el);

        if (node.left) { drawConn(node.left, node, svg); draw(node.left); }
        if (node.right) { drawConn(node.right, node, svg); draw(node.right); }
      }
      draw(root);
    }

    function drawConn(src, dest, svg) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const dx = (dest.x - src.x) * 0.5;
      path.setAttribute("d", `M ${src.x} ${src.y} C ${src.x + dx} ${src.y}, ${dest.x - dx} ${dest.y}, ${dest.x} ${dest.y}`);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", dest.cost > 39 ? "#f87171" : "#38bdf8");
      path.setAttribute("stroke-width", "2");
      path.setAttribute("stroke-dasharray", "4,4");
      svg.appendChild(path);
      if (window.gsap) gsap.fromTo(path, { strokeDashoffset: 60, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.6 });
    }

    function renderSteps(steps) {
      const box = document.getElementById("recipeBox");
      const list = document.getElementById("recipeSteps");
      const t = UI_TRANSLATIONS[currentLang];
      list.innerHTML = "";
      steps.forEach((s, i) => {
        const li = document.createElement("li");
        li.innerHTML = `${t.stepPrefix} ${i + 1}: ${t.stepPlace} <strong>${s.left}</strong> ${t.stepLeft} <strong>${s.right}</strong> ${t.stepRight} ➔ ${t.stepCost}: <span>${s.cost}${t.levels}</span>`;
        list.appendChild(li);
      });
      box.classList.remove("hidden");
    }

    function renderProgression(stageKey) {
      const data = PROGRESSION_I18N[stageKey][currentLang];
      const t = UI_TRANSLATIONS[currentLang];
      document.getElementById("stageTitle").textContent = data.title;
      document.getElementById("stageBadge").textContent = data.badge;
      document.getElementById("survivalTip").innerHTML = `<strong>${t.proTip}</strong> ${data.tip}`;
      document.getElementById("resourceBreakdown").innerHTML = data.breakdown;

      const grid = document.getElementById("stageSteps");
      grid.innerHTML = "";
      data.steps.forEach(st => {
        const card = document.createElement("div");
        card.className = "prog-card";
        card.innerHTML = `<span class="card-step">${st.step}</span><h3>${st.title}</h3><p>${st.desc}</p>`;
        grid.appendChild(card);
      });
    }

    function clearTree() {
      const t = UI_TRANSLATIONS[currentLang];
      document.getElementById("nodesLayer").innerHTML = "";
      document.getElementById("svgOverlay").innerHTML = "";
      document.getElementById("statusBanner").classList.add("hidden");
      document.getElementById("recipeBox").classList.add("hidden");
      document.getElementById("costIndicator").textContent = t.costDefault;
    }

    window.onload = () => {
      setupEvents();
      updateLanguageUI();
    };
