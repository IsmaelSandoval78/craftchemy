<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Craftchemy | Optimizador de Yunque y Alquimia de Encantamientos</title>
  <meta name="description" content="Calcula la ruta matemática óptima en el yunque de Minecraft para evitar el error 'Demasiado Caro'.">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="logo">Craft<span>chemy</span></div>
    <span class="badge">Anvil Solver v1.2</span>
  </header>

  <main class="main-container">
    <!-- Panel Izquierdo: Categorías y Encantamientos -->
    <aside class="sidebar">
      <h2>1. Selecciona Objeto</h2>
      <div class="item-grid" id="itemSelector">
        <button class="item-btn active" data-item="sword"><span class="pixel-icon">🗡️</span> Espada</button>
        <button class="item-btn" data-item="pickaxe"><span class="pixel-icon">⛏️</span> Pico</button>
        <button class="item-btn" data-item="boots"><span class="pixel-icon">🥾</span> Botas</button>
        <button class="item-btn" data-item="helmet"><span class="pixel-icon">🪖</span> Casco</button>
        <button class="item-btn" data-item="chestplate"><span class="pixel-icon">🛡️</span> Pechera</button>
        <button class="item-btn" data-item="bow"><span class="pixel-icon">🏹</span> Arco</button>
        <button class="item-btn" data-item="crossbow"><span class="pixel-icon">🎯</span> Ballesta</button>
        <button class="item-btn" data-item="trident"><span class="pixel-icon">🔱</span> Tridente</button>
      </div>

      <h2>2. Añade Encantamientos</h2>
      <div class="enchant-list" id="enchantList"></div>
      
      <button id="optimizeBtn" class="btn-primary">Optimizar Combinación</button>
    </aside>

    <!-- Panel Central: Lienzo del Árbol y Receta Paso a Paso -->
    <section class="canvas-area">
      <div class="canvas-header">
        <span id="costIndicator" class="cost-pill">Coste Total: -- niveles</span>
        <button id="resetBtn" class="btn-secondary">Reiniciar</button>
      </div>

      <div class="tree-wrapper" id="treeContainer">
        <svg id="svgOverlay" class="svg-layer"></svg>
        <div id="nodesLayer" class="nodes-layer"></div>
      </div>

      <div id="statusBanner" class="status-banner hidden"></div>

      <!-- Receta textual paso a paso -->
      <section class="recipe-container hidden" id="recipeBox">
        <h3>Instrucciones para el Yunque</h3>
        <ol id="recipeSteps" class="recipe-steps"></ol>
      </section>
    </section>
  </main>

  <footer class="app-footer">
    <p>NOT AN OFFICIAL MINECRAFT PRODUCT. NOT APPROVED BY OR ASSOCIATED WITH MOJANG OR MICROSOFT.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
