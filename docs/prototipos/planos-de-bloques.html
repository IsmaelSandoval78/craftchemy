<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planos de bloques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#e9eef5; --field:#f8fafd; --line:#1d4f91; --line-soft:rgba(29,79,145,.55); --grid:rgba(29,79,145,.07); --grid2:rgba(29,79,145,.15);
  --red:#cf3f2c; --sheet:#ffffff; --ink:#13294b; --muted:#566b8c; --rule:#cdd8e8; --chip:#eef3fa;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0f2b52; --field:#1b4a86; --line:#eaf2ff; --line-soft:rgba(234,242,255,.55); --grid:rgba(234,242,255,.06); --grid2:rgba(234,242,255,.13);
    --red:#ff8a78; --sheet:#143a6c; --ink:#eef4ff; --muted:#a9bfdf; --rule:#2c5791; --chip:#1d4a83;
  }
}
:root[data-theme="dark"]{
  --page:#0f2b52; --field:#1b4a86; --line:#eaf2ff; --line-soft:rgba(234,242,255,.55); --grid:rgba(234,242,255,.06); --grid2:rgba(234,242,255,.13);
  --red:#ff8a78; --sheet:#143a6c; --ink:#eef4ff; --muted:#a9bfdf; --rule:#2c5791; --chip:#1d4a83;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif}
a{color:inherit}
.tech{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif}
.hand{font-family:"Architects Daughter","Barlow",cursive}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 48px}

/* barra */
.bar{display:flex;gap:14px 20px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:30px;height:30px}
.brand b{font:700 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em}
.tools{display:flex;gap:10px;align-items:center;flex:1;justify-content:flex-end;min-width:280px}
.search{position:relative;flex:1;max-width:360px}
.search input{width:100%;font:inherit;font-size:15px;padding:9px 12px;border:1.5px solid var(--line-soft);border-radius:4px;background:var(--field);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--red)}
.sugg{position:absolute;z-index:9;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--sheet);border:1.5px solid var(--line-soft);border-radius:4px;max-height:340px;overflow:auto}
.sugg:empty{display:none}
.sugg li a{display:flex;align-items:center;gap:10px;padding:6px 8px;text-decoration:none;border-radius:3px}
.sugg li a:hover,.sugg li a:focus,.sugg li a.on{background:var(--chip);outline:none}
.sugg img{width:22px;height:22px;image-rendering:pixelated}
.sugg small{margin-left:auto;color:var(--muted)}
.lang{display:inline-flex;border:1.5px solid var(--line-soft);border-radius:4px;overflow:hidden}
.lang button{font:600 14px/1 "Barlow Condensed",sans-serif;letter-spacing:.03em;padding:9px 11px;background:transparent;color:var(--ink);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--line);color:var(--field)}
button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* lámina */
.sheetwrap{margin-top:18px;background:var(--field);border:2px solid var(--line);padding:10px;position:relative}
.plate{position:relative;border:1px solid var(--line-soft);
  background-color:var(--field);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
                   linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:96px 96px,96px 96px,16px 16px,16px 16px;
  padding:26px 28px 24px}
.zones{position:absolute;inset:0;pointer-events:none;font:600 11px/1 "Barlow Condensed",sans-serif;color:var(--line-soft)}
.zones span{position:absolute}
.plate-top{display:grid;grid-template-columns:1fr minmax(300px,380px);gap:24px;align-items:end}
.drawing{position:relative;min-height:330px}
.drawing svg{width:100%;height:auto;display:block;overflow:visible}
.drawing .dim{stroke:var(--line);stroke-width:1.2;fill:none}
.drawing .dimt{fill:var(--line);font:600 15px "Barlow Condensed",sans-serif}
.drawing .note{fill:var(--line);font:16px "Architects Daughter",cursive}
.drawing .lead{stroke:var(--line);stroke-width:1;fill:none}
.drawing .redline{stroke:var(--red);stroke-width:1.5;fill:none}
.drawing .redt{fill:var(--red);font:16px "Architects Daughter",cursive}

/* cajetín */
.cajetin{border:2px solid var(--line);display:grid;grid-template-columns:1fr 1fr;background:var(--field)}
.cajetin>div{border:1px solid var(--line-soft);padding:6px 9px;min-width:0}
.cajetin .full{grid-column:1/-1}
.cajetin small{display:block;margin-bottom:2px;font:500 12px/1.2 "Barlow Condensed",sans-serif;color:var(--muted);letter-spacing:.02em}
.cajetin b{display:block;font:600 17px/1.25 "Barlow Condensed",sans-serif;overflow-wrap:anywhere}
.cajetin h1{margin:0;font:700 clamp(28px,4vw,40px)/1.05 "Barlow Condensed",sans-serif}
.cajetin h1+span{display:block;color:var(--muted);font:500 16px "Barlow Condensed",sans-serif;margin-top:2px}

/* bloques de la lámina */
.block{margin-top:30px}
.block>header{display:flex;align-items:baseline;gap:12px;border-bottom:1.5px solid var(--line);padding-bottom:6px;margin-bottom:14px}
.block>header h2{margin:0;font:700 24px/1 "Barlow Condensed",sans-serif}
.block>header p{margin:0;color:var(--muted);font-size:14px}
.recipes{display:flex;flex-wrap:wrap;gap:16px}
.recipe{border:1.5px dashed var(--line-soft);padding:12px 14px 10px;background:color-mix(in srgb,var(--field) 70%,transparent)}
.recipe .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.recipe{max-width:100%}
.g3{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);border:1.5px solid var(--line)}
.g3 div{border:1px solid var(--line-soft);display:grid;place-items:center}
.g3 div.hit{outline:2px solid var(--red);outline-offset:-3px}
.g3 img,.part img{width:32px;height:32px;image-rendering:pixelated}
.part{width:54px;height:54px;border:1.5px solid var(--line);display:grid;place-items:center;position:relative;text-decoration:none}
.part.hit{outline:2px solid var(--red);outline-offset:2px}
.part .n{position:absolute;right:3px;bottom:1px;font:700 13px "Barlow Condensed",sans-serif}
.station{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:96px;text-align:center}
.station svg{width:64px;height:24px}
.station span{font:600 14px/1.15 "Barlow Condensed",sans-serif}
.station em{font:15px/1.15 "Architects Daughter",cursive;color:var(--red);font-style:normal}
.recipe figcaption{margin-top:8px;font:500 13px "Barlow Condensed",sans-serif;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;margin:0}

/* mapa de usos */
.usegrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.usemap svg{width:100%;height:auto;display:block}
.usemap .ln{stroke:var(--line-soft);stroke-width:1.2;fill:none}
.usemap .ln.alt{stroke-dasharray:5 4}
.usemap .nd rect{fill:var(--field);stroke:var(--line);stroke-width:1.5}
.usemap .nd:hover rect,.usemap .nd:focus rect{stroke:var(--red);stroke-width:2.5}
.usemap .nd{cursor:pointer}
.usemap .nd:focus{outline:none}
.usemap .ctr rect{fill:var(--field);stroke:var(--red);stroke-width:2.5}
.usemap .lbl{fill:var(--ink);font:500 12px "Barlow Condensed",sans-serif;text-anchor:middle}
.bom{border:1.5px solid var(--line)}
.bom table{width:100%;border-collapse:collapse;font-size:14px}
.bom th{font:600 13px "Barlow Condensed",sans-serif;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--line)}
.bom td{padding:5px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.bom td a{display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.bom td a:hover{text-decoration:underline}
.bom img{width:22px;height:22px;image-rendering:pixelated}
.bom .scroll{max-height:420px;overflow:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:26px;border-top:1.5px solid var(--line-soft);vertical-align:middle;margin-right:6px}
.legend i.alt{border-top-style:dashed}

/* anexos */
.annexes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:22px}
.annex{background:var(--sheet);border:1.5px solid var(--rule);padding:14px 16px 12px}
.annex.wide{grid-column:1/-1}
.annex h3{margin:0 0 10px;font:700 19px/1.1 "Barlow Condensed",sans-serif;display:flex;gap:10px;align-items:baseline}
.annex h3 span{font:600 13px "Barlow Condensed",sans-serif;color:var(--red);border:1.5px solid var(--red);padding:1px 5px}
.annex h4{margin:14px 0 6px;font:600 15px "Barlow Condensed",sans-serif;color:var(--muted)}
dl.spec{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;margin:0;font-size:15px}
dl.spec dt{color:var(--muted)} dl.spec dd{margin:0;font-weight:500}
.annex table{width:100%;border-collapse:collapse;font-size:14px}
.annex th{font:600 13px "Barlow Condensed",sans-serif;color:var(--muted);text-align:left;padding:5px 10px 5px 0;border-bottom:1.5px solid var(--rule)}
.annex td{padding:5px 10px 5px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.annex td a{text-decoration:underline;text-decoration-color:var(--line-soft)}
.annex .scroll{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{background:var(--chip);padding:4px 9px;font-size:14px;border-radius:3px}
.chips li small{color:var(--muted)}
.foot{margin-top:22px;color:var(--muted);font-size:13px}
@media (max-width:860px){
  .plate{padding:20px 14px}
  .plate-top,.usegrid{grid-template-columns:1fr}
  .drawing{min-height:0;margin:0 -8px}
  .g3{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px)}
  .block>header{flex-wrap:wrap}
}
</style>
</head>

function srcName(s){
  const L = LANG==='es'?0:1;
  if(SRC[s]) return SRC[s][L];
  let m;
  if((m = s.match(/^village\/village_(.+)$/))) return (LANG==='es'?'Aldea: ':'Village: ') + m[1].replace(/_/g,' ');
  if((m = s.match(/^trial_chambers\/(.+)$/))) return (LANG==='es'?'Cámaras de prueba: ':'Trial chambers: ') + m[1].replace(/_/g,' ');
  if((m = s.match(/^hero_of_the_village\/(.+)_gift$/))) { const p = F[m[1]] ? null : null; return (LANG==='es'?'Héroe de la aldea: regalo de ':'Hero of the village: gift from ') + m[1].replace(/_/g,' '); }
  if((m = s.match(/^sheep\/(.+)$/))) return (LANG==='es'?'Oveja ':'Sheep, ') + m[1].replace(/_/g,' ');
  return s.replace(/_/g,' ').replace(/\//g,' › ');
}

// figuras dibujadas con líneas
function strokeIcon(name, px, col){
  const line=(x0,y0,x1,y1,c)=>{ const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0)); for(let i=0;i<=n;i++) px(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),c); };
  if(/^stick$/.test(name)){ line(3,13,12,4,'#8a6b3e'); line(4,13,13,4,'#6b4f2c'); return true; }
  if(/^string$/.test(name)){ for(let x=2;x<14;x++) px(x,8+Math.round(Math.sin(x/1.6)*2),'#f2f2f2'); return true; }
  if(/arrow$/.test(name)){ line(3,12,11,4,'#8a6b3e'); px(12,3,'#cfcfcf');px(11,3,'#cfcfcf');px(12,4,'#cfcfcf');px(13,2,'#9a9a9a');
    const fl = name.startsWith('spectral')?'#f7d66b':name.startsWith('tipped')?'#b34ad1':'#f2f2f2'; [[2,11],[3,13],[2,13],[1,12],[4,13],[2,12]].forEach(([x,y])=>px(x,y,fl)); return true; }
  if(/^bow$/.test(name)){ for(let t=-1.2;t<=1.2;t+=.08){ px(Math.round(7+Math.cos(t-Math.PI/4)*7-3),Math.round(8+Math.sin(t-Math.PI/4)*7+3),'#8a6b3e'); }
    line(3,4,11,12,'#e6e6e6'); return true; }
  if(/^crossbow$/.test(name)){ line(3,12,12,3,'#6b4f2c'); line(4,12,13,3,'#8a6b3e'); line(2,6,8,1,'#9a9a9a'); line(9,13,14,7,'#9a9a9a'); line(5,3,12,10,'#e6e6e6'); return true; }
  if(/^trident$/.test(name)){ line(3,13,11,5,'#3ea79f'); line(4,13,12,5,'#4fd8d0'); line(10,2,14,6,'#4fd8d0'); line(11,1,11,4,'#4fd8d0'); line(14,4,15,4,'#4fd8d0'); px(15,5,'#4fd8d0'); px(12,1,'#4fd8d0'); return true; }
  if(/^mace$/.test(name)){ line(3,13,9,7,'#6b4f2c'); for(let x=8;x<14;x++) for(let y=2;y<8;y++) px(x,y,(x+y)%3?'#8d8d8d':'#5c5c5c'); px(14,1,'#dadada');px(7,1,'#dadada');px(14,8,'#dadada'); return true; }
  if(/^fishing_rod$/.test(name)){ line(2,14,12,2,'#8a6b3e'); for(let y=3;y<12;y++) px(13,y,'#e6e6e6'); px(12,12,'#9a9a9a');px(13,12,'#9a9a9a'); return true; }

function recipeHTML(r, cur){

  } else if(r.ingredientes){

// ---------------------------------------------------------------- mapa de usos
function useMap(f){
  const by = new Map();
  for(const r of f.usos.recetas||[]){ if(!by.has(r.resultado)) by.set(r.resultado,new Set()); by.get(r.resultado).add(r.tipo); }
  const list = [...by.entries()].sort((a,b)=>N(a[0]).localeCompare(N(b[0]),LANG));
  if(!list.length) return `<p class="empty">${S().noUses}</p>`;
  const n=list.length, W=560, H=480, cx=W/2, cy=H/2, two=n>12, showL=n<=12;
  let lines='', nodes='';
  list.forEach(([id,ts],i)=>{
    const a=-Math.PI/2+i/n*Math.PI*2, R=two?(i%2?205:130):175;
    const x=cx+Math.cos(a)*R*1.15, y=cy+Math.sin(a)*R*.9;
    const alt=!ts.has('mesa_de_crafteo');
    lines += `<path class="ln${alt?' alt':''}" d="M${cx},${cy} L${x},${y}"/>`;
    nodes += `<g class="nd" tabindex="0" role="link" data-id="${id}" transform="translate(${x},${y})" aria-label="${esc(N(id))}"><title>${esc(N(id))}</title><rect x="-21" y="-21" width="42" height="42"/><image href="${icon(id)}" x="-15" y="-15" width="30" height="30" style="image-rendering:pixelated"/>${showL?`<text class="lbl" y="36">${esc(N(id).length>18?N(id).slice(0,17)+'…':N(id))}</text>`:''}</g>`;
  });
  const ctr = `<g class="ctr" transform="translate(${cx},${cy})"><rect x="-30" y="-30" width="60" height="60"/><image href="${icon(f.id)}" x="-22" y="-22" width="44" height="44" style="image-rendering:pixelated"/></g>`;
  const rows = list.map(([id,ts])=>{
    const r = (f.usos.recetas||[]).find(x=>x.resultado===id);
    return `<tr><td><a href="#${id}"><img alt="" src="${icon(id)}">${esc(N(id))}</a></td><td>${[...ts].map(t=>S().st[t]).join(', ')}</td><td>${r.cantidad}</td></tr>`;
  }).join('');
  return `<div class="usegrid"><div class="usemap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${S().uses}">${lines}${nodes}${ctr}</svg>
    <div class="legend"><span><i></i>${S().legCraft}</span><span><i class="alt"></i>${S().legOther}</span></div></div>
    <div class="bom"><div class="scroll"><table><tr><th>${S().result}</th><th>${S().where}</th><th>${S().qty}</th></tr>${rows}</table></div></div></div>`;
}

// ---------------------------------------------------------------- anexos
const tbl = (h, rows) => `<div class="scroll"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
function specs(f){
  const d=f.datos, t=S().data, rows=[];
  const add=(k,v)=>{ if(v!==undefined&&v!==null&&v!=='') rows.push([k,v]); };
  add(t.apilable,d.apilable); add(t.durabilidad,d.durabilidad); add(t.rareza,S().rar[d.rareza]||d.rareza);
  if(d.resistente_al_fuego) add(t.fuego,t.yes); add(t.encantabilidad,d.encantabilidad);
  if(d.se_repara_con) add(t.repara,d.se_repara_con.map(link).join(', '));
  if(d.combate){ add(t.dano,d.combate.dano); add(t.vel,d.combate.velocidad); }
  if(d.armadura){ add(t.arm,d.armadura.armadura); add(t.dur,d.armadura.dureza); add(t.emp,d.armadura.resistencia_empuje); add(t.ran,S().slots[d.armadura.ranura]||d.armadura.ranura); }
  if(d.comida){ add(t.hambre,d.comida.hambre); add(t.sat,d.comida.saturacion); add(t.siempre,d.comida.siempre_comestible?t.yes:t.no); }
  if(d.bloque){ add(t.bdur,d.bloque.dureza); add(t.bres,d.bloque.resistencia); add(t.luz,d.bloque.luz);
    if(d.bloque.se_pica_con) add(t.pica,d.bloque.se_pica_con.map(x=>S().tools[x]).join(', '));
    if(d.bloque.nivel_minimo) add(t.min,S().lv[d.bloque.nivel_minimo]); }
  return `<dl class="spec">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}
function obtain(f){
  const o=f.obtener, s=S(); let h='';
  if(o.minar) h += `<h4>${s.mine}</h4>`+tbl([s.block,s.amount,s.conds], o.minar.map(m=>[link(m.bloque),range(m),condTxt(m.condiciones)]));
  if(o.criaturas) h += `<h4>${s.mobs}</h4>`+tbl([s.mob,s.amount,s.conds], o.criaturas.map(m=>[esc(m.nombre[LANG]),range(m),condTxt(m.condiciones)]));
  if(o.aldeanos) h += `<h4>${s.vill}</h4>`+tbl([s.villager,s.level,s.get,s.pay], o.aldeanos.map(t=>[esc(t.nombre[LANG]),t.nivel??'—',t.da,t.pide.map(p=>`${p.cantidad} × ${link(p.item)}`).join(' + ')]));
  let chest=false;
  for(const [k,t] of [['cofres',s.chests],['arqueologia',s.arch],['esquilar',s.shear],['cepillar',s.brush],['cosechar',s.harvest],['otros',s.other]])
    if(o[k]){ chest=true; h += `<h4>${t}</h4>`+tbl([s.source,s.amount,s.chance,s.conds], o[k].map(m=>[esc(srcName(m.fuente)),range(m),m.peso!==undefined?`${Math.round(m.peso*1000)/10}%`:'—',condTxt(m.condiciones)])); }
  if(chest) h += `<p class="empty" style="margin-top:8px;font-size:13px">${s.chanceNote}</p>`;
  if(s.extra[f.id]) h += `<h4>${LANG==='es'?'En el mundo':'In the world'}</h4><p style="margin:0">${s.extra[f.id]}</p>`;
  return h || `<p class="empty">${s.noObtain}</p>`;
}
function trade(f){
  const u=f.usos, s=S(); let h='';
  if(u.aldeanos) h += `<h4>${s.sell}</h4>`+tbl([s.villager,s.level,s.give,s.receive], u.aldeanos.map(t=>[esc(t.nombre[LANG]),t.nivel??'—',t.cantidad,`${t.recibes_cantidad} × ${link(t.recibes)}`]));
  if(u.especiales) h += `<h4>${s.otherUses}</h4><ul class="chips">${u.especiales.map(e=>`<li>${s.esp[e]||e}</li>`).join('')}</ul>`;
  return h || `<p class="empty">${s.noA4}</p>`;
}

// ---------------------------------------------------------------- render
function render(){
  let id = decodeURIComponent(location.hash.slice(1)) || 'cobblestone';
  if(!F[id]) id='cobblestone';
  const f=F[id], s=S(), d=f.datos;
  document.title = `${N(id)} · ${s.brand}`;
  const fab = (f.obtener.recetas||[]);
  const zones = ['A','B','C','D'].map((z,i)=>`<span style="left:4px;top:${12+i*25}%">${z}</span><span style="right:4px;top:${12+i*25}%">${z}</span>`).join('') +
    [1,2,3,4,5,6].map((z,i)=>`<span style="top:3px;left:${8+i*16.5}%">${z}</span>`).join('');
  const ench = d.encantamientos ? `<section class="annex"><h3><span>A3</span>${s.A3}</h3><ul class="chips">${d.encantamientos.map(e=>`<li>${esc(e.nombre[LANG])} <small>${s.maxLv} ${e.nivel_max}${e.maldicion?`, ${s.curse}`:''}${e.tesoro&&!e.maldicion?`, ${s.treasure}`:''}</small></li>`).join('')}</ul></section>` : '';
  document.getElementById('app').innerHTML = `
  <div class="sheetwrap"><div class="plate"><div class="zones" aria-hidden="true">${zones}</div>
    <div class="plate-top">
      <div class="drawing">${drawing(f)}</div>
      <div class="cajetin">
        <div class="full"><small>${s.object}</small><h1>${esc(N(id))}</h1><span>${esc(f.nombre[LANG==='es'?'en':'es'])}</span></div>
        <div class="full"><small>${s.id}</small><b>minecraft:${id}</b></div>
        <div><small>${s.sheet}</small><b>${SHEETNO[id]} ${s.of} ${IDS.length}</b></div>
        <div><small>${s.version}</small><b>26.1</b></div>
        <div><small>${s.rarity}</small><b>${s.rar[d.rareza]||d.rareza}</b></div>
        <div><small>${s.scale}</small><b>${s.scaleV}</b></div>
      </div>
    </div>
    <section class="block"><header><h2>${s.fab}</h2><p>${s.fabSub}</p></header>
      ${fab.length ? `<div class="recipes">${fab.map(r=>recipeHTML(r,id)).join('')}</div>` : `<p class="empty">${s.noFab}</p>`}
    </section>
    <section class="block"><header><h2>${s.uses}</h2><p>${s.usesSub}</p></header>${useMap(f)}</section>
  </div></div>
  <div class="annexes">
    <section class="annex"><h3><span>A1</span>${s.A1}</h3>${specs(f)}</section>
    ${ench}
    <section class="annex wide"><h3><span>A2</span>${s.A2}</h3>${obtain(f)}</section>
    <section class="annex"><h3><span>A4</span>${s.A4}</h3>${trade(f)}</section>
  </div>`;
  document.querySelectorAll('.usemap .nd').forEach(g=>{
    const go=()=>{ location.hash = g.dataset.id; };
    g.addEventListener('click',go); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
  });
}
function applyLang(){
  document.documentElement.lang=LANG; const s=S();
  document.getElementById('brandName').textContent=s.brand;
  q.placeholder=s.ph; q.setAttribute('aria-label',s.ph);
  document.getElementById('foot').textContent=s.foot;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===LANG));
}
// ---------------------------------------------------------------- búsqueda
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const IDX = IDS.map(id=>({id,k:norm(F[id].nombre.es+' '+F[id].nombre.en+' '+id.replace(/_/g,' '))}));
const q=document.getElementById('q'), sugg=document.getElementById('sugg'); let hits=[], hi=0;
function showSugg(){
  const v=norm(q.value.trim()); if(!v){ sugg.innerHTML=''; hits=[]; return; }
  hits = IDX.filter(x=>x.k.includes(v)).sort((a,b)=>a.k.indexOf(v)-b.k.indexOf(v)||a.k.length-b.k.length).slice(0,10).map(x=>x.id); hi=0;
  sugg.innerHTML = hits.length ? hits.map((id,i)=>`<li><a href="#${id}" class="${i===0?'on':''}"><img alt="" src="${icon(id)}">${esc(N(id))}<small>${esc(F[id].nombre[LANG==='es'?'en':'es'])}</small></a></li>`).join('') : `<li style="padding:6px 8px;color:var(--muted)">${S().none}</li>`;
}
q.addEventListener('input',showSugg);
q.addEventListener('keydown',e=>{
  if(!hits.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); hi=(hi+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length; sugg.querySelectorAll('a').forEach((a,i)=>a.classList.toggle('on',i===hi)); }
  if(e.key==='Enter'){ e.preventDefault(); location.hash=hits[hi]; }
  if(e.key==='Escape'){ sugg.innerHTML=''; hits=[]; }
});
sugg.addEventListener('click',()=>setTimeout(()=>{ sugg.innerHTML=''; q.value=''; hits=[]; },0));
window.addEventListener('hashchange',()=>{ sugg.innerHTML=''; q.value=''; hits=[]; render(); window.scrollTo(0,0); });
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{ LANG=b.dataset.l; try{localStorage.setItem('bp-lang',LANG);}catch(e){} applyLang(); render(); });
applyLang(); render();
</script>
</body>
</html>
